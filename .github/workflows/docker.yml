name: Docker Deploy

on:
  push:
    branches:
      - main

jobs:
  check-secrets:
    name: Check Docker Hub credentials
    runs-on: ubuntu-latest
    outputs:
      has_docker_secrets: ${{ steps.check.outputs.has_docker_secrets }}
    steps:
      - name: Detect configured Hub secrets
        id: check
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_PASSWORD" ]; then
            echo "has_docker_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_docker_secrets=false" >> "$GITHUB_OUTPUT"
          fi

  docker:
    name: Docker Build and Push
    needs: check-secrets
    if: needs.check-secrets.outputs.has_docker_secrets == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/spotify_player:latest

      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
