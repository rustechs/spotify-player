theme = "default"
login_redirect_uri = "http://127.0.0.1:8989/login"
client_id = "d420a117a32841c2b3474932e49fb54b"
client_port = 8080
tracks_playback_limit = 50
playback_format = "{status} {track} • {artists}\n{album} • {genres}"
playback_metadata_fields = ["repeat", "shuffle", "volume", "device"]
notify_format = { summary = "{track} • {artists}", body = "{album}" }
notify_timeout_in_secs = 0
notify_transient = false
app_refresh_duration_in_ms = 32
playback_refresh_duration_in_ms = 0
page_size_in_rows = 20
enable_media_control = false
enable_streaming = "Always"
enable_audio_visualization = false
enable_system_audio_visualization = false
system_audio_source = "auto"
enable_notify = true
enable_cover_image_cache = true
# preferred_device = "estelle"
notify_streaming_only = false
play_icon = "▶"
pause_icon = "▌▌"
liked_icon = "♥"
genre_num = 2
cover_img_length = 0
cover_img_width = 6
cover_img_pixels = 16
seek_duration_secs = 5
custom_queue = true
enable_relative_line_number = false
enable_toast = true
toast_success_timeout_secs = 3

[device]
name = "spotify-player"
device_type = "speaker"
volume = 70
bitrate = 320
audio_cache = false
normalization = false
autoplay = false

# Linux: launch/nudge official desktop Spotify when Connect cannot see it yet
# [desktop_spotify]
# enable = true
# command = "spotify"
# args = []
# mpris_dest = "org.mpris.MediaPlayer2.spotify"
# nudge_uri = "spotify:track:4iV5W9uYEdYUVa79Axb7Rh"
# pause_after_nudge = true
# ready_timeout_secs = 45

[layout]
library = { playlist_percent = 40, album_percent = 40 }
playback_window_position = "Top"
playback_window_height = 6
